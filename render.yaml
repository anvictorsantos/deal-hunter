# Render blueprint — one Node web service, database lives on Neon Postgres.
#
# Set DATABASE_URL (pooled) and DATABASE_URL_UNPOOLED (direct) from the Neon
# project in the Render dashboard. No disk is needed.
# Deploy: Render → New → Blueprint → this repo. Spec: render.com/docs/blueprint-spec
services:
  - type: web
    name: deal-hunter
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    # --with-deps installs Chromium's OS libraries for the OLX scraper.
    # db:generate must run before the Nuxt build: server code imports @prisma/client.
    buildCommand: >-
      npm ci --no-audit --no-fund &&
      npm run db:generate &&
      npx playwright install --with-deps chromium &&
      npm run build
    # db:push applies schema changes; it refuses destructive changes instead of
    # silently dropping data. It uses DATABASE_URL_UNPOOLED via prisma.config.ts.
    startCommand: >-
      npx prisma db push --skip-generate &&
      node .output/server/index.mjs
    healthCheckPath: /api/platforms
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # Pooled connection for the app, direct connection for Prisma CLI.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: RAWG_API_KEY
        sync: false
      # Also set this value as the GitHub repo secret CRON_SECRET.
      - key: CRON_SECRET
        generateValue: true
      # OLX partner credentials power the "Near me" filter (ADR 0006).
      - key: OLX_CLIENT_ID
        sync: false
      - key: OLX_CLIENT_SECRET
        sync: false
