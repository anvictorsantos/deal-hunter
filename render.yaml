# Render blueprint — one Docker web service, database lives on Neon Postgres.
#
# Docker because Render's native Node runtime runs as non-root, so Playwright's
# `--with-deps` cannot apt-install Chromium's system libraries. The Playwright
# base image ships them. No disk is needed.
# Set DATABASE_URL (pooled) and DATABASE_URL_UNPOOLED (direct) from the Neon
# project in the Render dashboard.
# Deploy: Render → New → Blueprint → this repo. Spec: render.com/docs/blueprint-spec
services:
  - type: web
    name: deal-hunter
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    # Leave dockerCommand blank: the image CMD runs `prisma db push && node ...`
    # through a shell. Render's Docker Command field splits on spaces and does
    # not interpret `&&`.
    healthCheckPath: /api/platforms
    envVars:
      # Pooled connection for the app, direct connection for Prisma CLI.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: RAWG_API_KEY
        sync: false
      # Also set this value as the GitHub repo secret CRON_SECRET.
      - key: CRON_SECRET
        generateValue: true
      # OLX partner credentials power the "Near me" filter (ADR 0006).
      - key: OLX_CLIENT_ID
        sync: false
      - key: OLX_CLIENT_SECRET
        sync: false
